name: Check Proof Protocol
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  bundles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/proof-bundles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/proof-bundles/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
